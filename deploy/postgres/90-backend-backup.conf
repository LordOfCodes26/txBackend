# Continuous WAL archiving for point-in-time recovery (installed into
# /etc/postgresql/<version>/main/conf.d/). Every completed WAL segment is copied to the
# archive, gzipped (written as .partial, then renamed, so a half-written file is never
# taken for a whole one). archive_timeout forces a segment switch at least every 10 minutes
# while the database is active, so at most ~10 minutes of committed work can be lost.
#
# Each switch archives a whole 16 MB segment however little changed; gzip shrinks a mostly
# empty one to ~16 KB. A 1-minute timeout with plain copies wrote ~23 GB a day and filled
# a server's disk; this writes a few MB a day for a quiet database.
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/backups/backend/wal/%f.gz && gzip -c %p > /var/backups/backend/wal/%f.gz.partial && mv /var/backups/backend/wal/%f.gz.partial /var/backups/backend/wal/%f.gz'
archive_timeout = 600
