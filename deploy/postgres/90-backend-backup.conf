# Continuous WAL archiving for point-in-time recovery (installed into
# /etc/postgresql/<version>/main/conf.d/). Every completed WAL segment is copied to the
# archive; archive_timeout forces a segment switch at least once a minute while the
# database is active, so at most ~1 minute of committed work can be lost.
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/backups/backend/wal/%f && cp %p /var/backups/backend/wal/%f'
archive_timeout = 60
