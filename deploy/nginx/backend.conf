# TLS uses a local certificate (/etc/backend/tls). Offline there is no Let's Encrypt:
# use a certificate from your internal CA, or the self-signed one the installer creates.
upstream backend_app {
    server unix:/run/backend/gunicorn.sock fail_timeout=0;
}

upstream backend_ws {
    server 127.0.0.1:8091 fail_timeout=0;
}

# The frontend (Next.js) when installed (install-all.sh); see /etc/backend/nginx-root.conf.
upstream frontend_app {
    server 127.0.0.1:3100 fail_timeout=0;
}

# Internal address for the frontend server: pass on the browser IP it sends, else its own.
map $http_x_forwarded_for $internal_client_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

server {
    listen 80 default_server;
    server_name _;

    location /health/ {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/backend/tls/cert.pem;
    ssl_certificate_key /etc/backend/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /ws/ {
        proxy_pass http://backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /static/ {
        alias /opt/backend/current/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /var/lib/backend/media/;
    }

    # The backend's own paths always go to the backend.
    location ~ ^/(api/v1|api/schema|api/docs|admin|health|test-console)(/|$) {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
    }

    # Everything else: the backend alone, or the frontend when it is installed. The
    # installers write this file; upgrades keep it.
    location / {
        include /etc/backend/nginx-root.conf;
    }
}

# Local only: the frontend server (Next.js) calls the backend here (API_URL), without TLS.
server {
    listen 127.0.0.1:8001;
    server_name _;
    client_max_body_size 10m;

    location / {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $internal_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
    }
}
