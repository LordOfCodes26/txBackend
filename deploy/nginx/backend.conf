# TLS uses a local certificate (/etc/backend/tls). Offline there is no Let's Encrypt:
# use a certificate from your internal CA, or the self-signed one the installer creates.
upstream backend_app {
    server unix:/run/backend/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    server_name _;

    location /health/ {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/backend/tls/cert.pem;
    ssl_certificate_key /etc/backend/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /static/ {
        alias /opt/backend/current/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /var/lib/backend/media/;
    }

    location / {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
    }
}
