# Grist (install-grist.sh) over HTTPS: https://<server>:8444. Grist's own login gate (nginx
# in Docker) listens on 127.0.0.1:8484 only; this adds TLS in front of it, with the same
# certificate as the web app. Each person signs in with their Grist username and password.
server {
    listen 8444 ssl;
    server_name _;

    ssl_certificate     /etc/backend/tls/cert.pem;
    ssl_certificate_key /etc/backend/tls/key.pem;
    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:8484;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }
}
