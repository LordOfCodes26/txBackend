# Staging: the same app on HTTP :8088 and HTTPS :8443 (self-signed cert for the IP).
# gunicorn listens on 127.0.0.1:8089 only; nginx is the public entry point.
upstream backend_staging {
    server 127.0.0.1:8089 fail_timeout=0;
}

upstream backend_staging_ws {
    server 127.0.0.1:8092 fail_timeout=0;
}

# The frontend (Next.js, frontend-staging.service) answers every non-backend path.
upstream frontend_staging {
    server 127.0.0.1:3100 fail_timeout=0;
}

server {
    listen 8088;
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/backend/tls/staging-cert.pem;
    ssl_certificate_key /etc/backend/tls/staging-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /ws/ {
        proxy_pass http://backend_staging_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /media/ {
        alias /var/lib/backend/media/;
        expires 7d;
    }

    # The backend's own paths always go to the backend.
    location ~ ^/(api/v1|api/schema|api/docs|api-auth|admin|health|test-console|static)(/|$) {
        proxy_pass http://backend_staging;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
    }

    # Everything else: the frontend. $http_host keeps the port (8088/8443) for its
    # redirects and WebSocket URL.
    location / {
        proxy_pass http://frontend_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_redirect off;
    }
}
